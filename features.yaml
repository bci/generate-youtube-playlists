# features.yaml — canonical feature-status manifest for the generate-youtube-playlists repo.
#
# Purpose: a structured rollup of what this tool does and what is still planned, so a
# teammate (or a Claude session) can answer "is the Shorts split done?" or "what is left
# for macOS?" without reading the source.
#
# How this relates to the other tracking files:
#   VERSIONS.md   — the changelog: what shipped in which release
#   WORKLOG.md    — the narrative: what was done and WHY it is shaped that way
#   features.yaml — this file: one entry per feature, stable ids, current status
#
# Schema
# ------
# version: integer — bump on any breaking schema change.
# updated: YYYY-MM-DD — last time this file changed.
# components: list of { id, name, path } — the surfaces a feature can touch.
# features: list of entries:
#   id:          "FEAT-NNNN" (zero-padded, stable, never renumbered).
#   title:       short human-readable title
#   description: 1-3 sentences, user-facing where possible
#   components:  list of component ids
#   status:      planned | in-dev | in-test | complete | deferred
#   release:     the VERSIONS.md release that LAST changed this feature
#                ("Unreleased" when its newest change has not shipped yet)
#   added:       YYYY-MM-DD the feature first landed
#   updated:     YYYY-MM-DD its most recent change
#   notes:       free-form — evidence, follow-ups, caveats.
#
# The repo history was squashed to a single initial commit on 2026-09-12, so every
# shipped feature below carries that date. It is the date the public repo begins, not
# the date each feature was originally written.

version: 1
updated: 2026-09-15

components:
  - id: core
    name: Node CLI
    path: src
  - id: ops
    name: Scheduling wrappers and scheduled tasks
    path: .
  - id: qa
    name: Tests
    path: test
  - id: tooling
    name: Task runner and shims
    path: make.js

features:
  - id: FEAT-0001
    title: Per-channel chronological playlist sync
    description: >
      Resolve a channel handle to its uploads, find-or-create a private playlist named
      after it, and insert the missing videos at their chronological positions. Reruns
      are idempotent.
    components: [core, qa]
    status: complete
    release: 2026.09.12
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      Two-phase by design - read every channel before writing anything - so a mid-run
      quota stop still produces a truthful report. Inserts run smallest-backlog-first.

  - id: FEAT-0002
    title: Per-channel publish-date window (after= / older=)
    description: >
      A channel line can carry a UTC, inclusive cutoff. older=remove (the default)
      deletes anything below it; older=keep gates additions only.
    components: [core, qa]
    status: complete
    release: 2026.09.12
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      A cutoff deletion is forgotten by the ledger rather than banked as a watch, so
      moving the date later does not hold that catalogue out for good. Verified against
      the live account on 2026-09-12.

  - id: FEAT-0003
    title: Shorts handling, including split into a second playlist
    description: >
      shorts= takes no (default), yes, only, or split. split gives one channel two
      playlists - its videos and its Shorts - named via shorts-title= when desired.
    components: [core, qa]
    status: complete
    release: 2026.09.12
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      Both playlists come from a SINGLE channel read; the uploads listing and the Shorts
      probe are charged per channel, not per playlist. Known limit - there is no
      shorts=remove, so turning Shorts off leaves the ones already in a playlist.

  - id: FEAT-0004
    title: Watched-video ledger and pruning
    description: >
      Videos that have been watched are deleted from the playlist and never re-added.
      Three signals feed one ledger: a Like, a removal by hand, and a manually curated
      Watched playlist that the tool only ever reads.
    components: [core, qa]
    status: complete
    release: 2026.09.12
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      YouTube exposes no watch history, so these signals are the substitute. The ledger
      is permanent by design - a delete without a memory becomes a delete/re-add loop at
      100 quota units per video per night.

  - id: FEAT-0005
    title: HTML run report
    description: >
      One row per playlist with Added / Removed / In playlist columns, a short status
      note, and a link to each playlist. Written to report.html every run.
    components: [core, qa]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-12
    updated: 2026-09-15
    notes: >
      Pure builder in src/report.js, so it is testable without an API key. The document
      declares <meta charset="utf-8"> as of 2026-09-15: it is read as a file:// URL and as
      a mail body, neither of which supplies a Content-Type, so undeclared the em dashes,
      curly quotes and warning triangle rendered as mojibake under Windows' cp1252 default.

  - id: FEAT-0006
    title: Emailed report via Microsoft Graph
    description: >
      Optional delivery of the run report through the Microsoft 365 Graph API
      (client-credentials flow), with --email-on-change for unattended runs.
    components: [core]
    status: complete
    release: 2026.09.12
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      The sender must be a real licensed mailbox - Graph rejects an address with nothing
      behind it, including a Google identity sharing the domain.

  - id: FEAT-0007
    title: Heartbeat and staleness watchdog
    description: >
      Every completed run writes state/last-run.json; a separate watchdog emails an
      alert when the last successful run is older than 36 hours.
    components: [core, ops, qa]
    status: complete
    release: 2026.09.12
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      Exists because a scheduled task that never fires writes no log, so its failure is
      invisible to anything that reads logs. 36 hours is two missed nights, so one late
      run stays silent.

  - id: FEAT-0008
    title: Windows scheduled-task wrappers
    description: >
      run-sync.cmd and run-watchdog.cmd, driven by two Windows Scheduled Tasks, with
      output appended to logs/.
    components: [ops]
    status: complete
    release: 2026.09.12
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      The task must be registered with -LogonType S4U; an interactive-only task is
      skipped in silence on every night nobody is logged on.

  - id: FEAT-0009
    title: macOS support - launchd scheduling and shell wrappers
    description: >
      Run the nightly sync and the watchdog unattended on macOS: run-sync.sh and
      run-watchdog.sh alongside the two .cmd wrappers, two LaunchDaemon templates in
      launchd/ replacing the Scheduled Tasks, and a README section covering setup plus
      the state/ migration.
    components: [ops]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      Built 2026-09-12; what shipped is described in docs/prompts/prompt-macos-support-v2.md
      (v1 is the superseded brief). src/ was not touched and no dependency was added, as
      predicted. Daemons rather than Agents, because the target is a shared family Mac where
      nobody is logged in at 3 AM and an Agent would be skipped in silence - the macOS twin
      of the -LogonType S4U lesson in FEAT-0008. UserName keeps a daemon from running as
      root; it is honoured only in the system domain, so it is available precisely because
      of that choice. Node is resolved inside the wrappers (PATH, then both Homebrew
      locations) rather than via EnvironmentVariables, so a by-hand test exercises the same
      code launchd will.
      Verified end to end under launchd on 2026-09-12 16:08 via a temporary system-domain
      daemon on a calendar trigger: it fired on time, resolved /opt/homebrew/bin/node through
      the wrapper fallback (launchd's PATH has neither Homebrew location), ran as the
      UserName account rather than root - report.html, logs/ and state/*.json all owned by
      the user - added the 1 video the dry run predicted, emailed the report, and exited 0
      with both launchd std logs empty. Also verified: wrappers by hand, watchdog quiet when
      fresh and alerting when aged, 125 tests and lint clean on macOS 26.6.2 / Node 26.8.1.
      The migration trap was cleared first: after copying .env, state/ and
      config/channels.txt, a dry run proposed 1 insert across 7 playlists rather than the
      hundreds an empty ledger would have.
      Verified but NOT deployed: the daemons were booted out after testing and Windows
      remains the live host, because invariant 10 allows one machine per account. The Mac's
      heartbeat going stale is expected, not a fault.

  - id: FEAT-0010
    title: Sync marker playlist - detect a second machine syncing this account
    description: >
      Leave a private, empty marker playlist named gyp-sync-<key> on the account, so a run
      can tell whether another installation of this tool already owns it. A foreign marker
      is reported in the console, report.html and the email; --claim-sync takes ownership by
      renaming it. The sync is never blocked.
    components: [core, qa]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-12
    updated: 2026-09-12
    notes: >
      Built 2026-09-12 to the spec in docs/prompts/prompt-sync-marker-v1.md. Makes invariant 10 of the sync prompt
      (exactly one machine syncs an account) observable rather than merely documented - two
      schedulers on one account trade videos back and forth at 50 units a write, and the
      symptom looks trivial next to the cost. Detection is ~1 unit per run (playlists.list
      is 1 unit per page, and findPlaylistByTitle already pages that same list once per
      playlist); creation is 50 units once; --claim-sync is 50 more, only when asked.
      Three design choices worth not relitigating: replacement must stay explicit, because
      two machines that both auto-replace flap forever at 50 units a write; --claim-sync is
      interactive-only (fatal when stdin is not a TTY), which makes that flap unreachable
      even by misconfiguration since the flag cannot work from a plist or a Scheduled Task;
      and the key is the hostname rather than a uuid in state/, because the documented
      host-move procedure copies state/ across, which would give both machines the same key
      and defeat the guard in exactly the case it exists for. Known limit: it only helps once every machine runs
      a build that writes the marker.
      2026-09-15: handover to the Windows host completed - it renamed the existing marker
      (same playlist id), so 50 units not 100. Two observations recorded in
      docs/prompts/prompt-sync-marker-v2.md §3a: a stale marker reports a true-looking but
      wrong "another machine is syncing" until claimed, and os.hostname() on the Mac churned
      from locasta to Mac.lan within three days while ComputerName/LocalHostName did not -
      so machineKey() is built from the least stable name macOS keeps. Both argue for the
      report-never-block rule rather than against it; no code change made.
      Implemented as src/marker.js (pure: classifyMarker/checkClaimSync/machineKey take
      data and return decisions) plus listMyPlaylists/renamePlaylist in src/youtube.js and
      the phase-1 check in src/index.js. 23 new tests, 148 total, lint clean.
      Verified against the live account on 2026-09-12: the TTY refusal exits 1 before any
      API call (node src/index.js --claim-sync < /dev/null); a planted gyp-sync-otherbox
      was detected, named in the console, the summary and the report banner, and paged
      ERROR_ALERT_TO rather than the report audience, while the sync ran normally;
      --claim-sync from a terminal renamed it to gyp-sync-thisbox, leaving exactly one
      marker with the SAME playlist id - proof it renamed rather than delete+insert, so 50
      units and not 100. npm start -- --claim-sync preserves stdin's TTY, so the form the
      README documents works. The create-on-first-run branch is covered by a mocked client
      rather than live, since exercising it for real would cost 100 units to test three
      lines.

  - id: FEAT-0011
    title: Cross-platform task runner - make, build.ps1 and make.js
    description: >
      One target per maintenance action - setup, doctor, dry-run, run, add-channel,
      install, status, ci and the rest - implemented once in make.js and reached through
      `make <target>` on macOS or `.\build.ps1 <target>` on Windows. Running either shim
      with no target prints the generated list.
    components: [tooling, ops, qa]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-15
    updated: 2026-09-15
    notes: >
      Built 2026-09-15. The alternative considered and rejected was a Makefile and a
      build.ps1 each carrying its own implementation: that writes every target twice, in
      two languages, and only ever tests one of them per machine - and add-channel would
      have meant a second channels.txt parser in sed and a third in PowerShell, beside the
      real one in src/index.js. Node decided it: package.json already pins >= 20.12, so it
      is the only interpreter guaranteed on both platforms, while make is absent on Windows
      and PowerShell on macOS. The shims are ~40 lines each and do not change when a target
      is added; help is rendered from the registry, so the menu cannot go stale.
      2026-09-15: added change-email (sets REPORT_TO in .env, rewriting one line and
      leaving the comments that say what each key is for), and a generated target list
      inside both shims. The list exists because a fully generic shim names no target, so
      opening the Makefile to check whether `uninstall` exists shows nothing - reported
      four separate times for four targets that were already there. `sync-shims` writes
      it and the `shims` check (FEAT-0013) fails when it drifts, so it cannot become the
      stale hand-kept menu this design set out to avoid.
      Three make-specific hazards were found by testing against the GNU Make 3.81 that
      macOS ships, and all three fail silently. (1) `make test` finds the test/ directory,
      decides it is up to date and does nothing - fixed with .PHONY over MAKECMDGOALS.
      (2) `make run --dry-run` is taken as make's own -n, so the recipe is echoed and
      nothing runs, which reads as a dry run that worked. (3) `make run --max=1` is matched
      as an abbreviation of make's --max-load and becomes `-l 1`, silently removing the cap
      on writes against a live account. (2) and (3) are caught by marking the recipe `+`
      so it still executes under -n and having make.js refuse when MAKEFLAGS carries the
      letter make kept; key=value (max=1) is the supported spelling, ARGS='...' the escape
      hatch. A fourth, on the PowerShell side: an unquoted @Handle is a splatting
      expression that expands to $null, and PowerShell drops nulls when building a native
      command's argv - so `run @One` and `run` are indistinguishable by the time node sees
      them, and the second syncs every channel. Guarded in build.ps1, where $args still
      holds it; -contains rather than a Where-Object pipeline, because the pipeline emits
      the $null it matched and `if ($null)` is false.
      Known limits: the Windows half (Register-ScheduledTask, Get-ScheduledTaskInfo,
      Start-ScheduledTask) is written to the form the README already documents but has not
      been run on Windows - only the shim's argument handling was verified, against pwsh
      7.6 on macOS. `setup`, `install`, `uninstall`, `run-now`, `authorize` and `claim`
      are likewise unexercised here: they install system jobs, need a browser, or spend
      quota. 16 new tests, 164 total, lint clean.

  - id: FEAT-0012
    title: Release a sync claim - unclaim and unclaim-all
    description: >
      `--unclaim-sync` deletes this machine's sync marker, giving the account up so another
      machine can take it; `--unclaim-all` deletes every marker, leaving the account
      unclaimed for whichever machine syncs first. Both are terminal-only and cost 50 quota
      units per marker.
    components: [core, tooling, qa]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-15
    updated: 2026-09-15
    notes: >
      Completes the pair FEAT-0010 left open: claiming existed, releasing did not, and the
      README's answer was to delete the marker playlist by hand in the YouTube UI. It also
      resolves the one case checkSyncMarker() explicitly cannot - with two markers present
      it refuses to claim, because renaming onto an existing title would leave two playlists
      with the same name, and tells the reader to go to the UI. Deleting ours is that same
      fix from the command line.
      Terminal-only for a worse reason than --claim-sync's, so it has its own check rather
      than sharing one: an unattended claim flaps at 50 units a write, but an unattended
      unclaim costs 100 a night forever, because the next run finds no marker and creates
      one - release, recreate, release - and each half of that loop looks correct in the
      log. `make unclaim` additionally refuses while the nightly job is still installed on
      this machine, since tonight's run would claim the account straight back; the
      documented order is uninstall, then unclaim. npm start -- --unclaim-sync overrides.
      planUnclaim() is pure - it takes the titles the API already returned and returns a
      decision - so every branch is tested without a client, including that only markers
      are ever deleted and that one failed delete does not strand the others under
      --unclaim-all. 12 tests, none of which spends quota.

  - id: FEAT-0013
    title: Pre-push checks - make check and a reporting ci
    description: >
      `make check` runs twelve checks for what lint and the test suite cannot see. Among them:
      secrets or ids in tracked files, a features.yaml that no longer parses or breaks its own
      rules, CRLF in a file pinned to LF, broken documentation links, a shim target list that
      has drifted, a target whose documented arguments would not survive a make command line,
      a node version below the declared floor, missing bookkeeping, and npm audit findings.
      The README's check table is the full list, and the docs check keeps it that way. `make ci` runs lint, the tests and every check, and
      reports all failures at once rather than stopping at the first.
    components: [tooling, qa, ops]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-15
    updated: 2026-09-15
    notes: >
      Two guardrails this repo states but nothing enforced now have teeth. CLAUDE.md section
      12 (no addresses, ids or channel names in tracked files) is checked on every tracked
      file, at error level, because a push is not reversible and a secret that reaches GitHub
      has to be rotated whether or not the commit is later removed. AGENTS.md said outright
      of features.yaml that "nothing enforces this automatically - there is no CI for it in
      this repo"; that sentence is now false, and the check covers the documented rules
      (unique ascending zero-padded ids, valid status, real dates, known components, a
      release: that names an actual VERSIONS.md heading) as well as YAML validity.
      Error versus warning is a deliberate line: errors fail, warnings print and do not,
      because a warning that blocks a push is an error wearing a disguise and the honest fix
      is to promote it rather than to teach people --no-verify. For the same reason ci runs
      everything before reporting - "fix one, run again, find the next" is how a gate gets
      skipped. The bookkeeping check is a warning on purpose: it must not block a genuine
      one-line typo fix.
      Adds `yaml` (2.9.1, zero transitive dependencies) as the first new devDependency since
      eslint. The alternatives were a hand-written parser for a restricted subset, which
      would accept files real YAML rejects, or shelling out to python3+pyyaml, which
      degrades to "skipped" on the Windows host - the machine that actually pushes.
      Two bugs in the checker itself were caught by running it: links were resolved from the
      repo root rather than from the linking file, which reported all 13 cross-references
      between the docs/prompts/ files as broken, and probing for a tool with shell:true plus
      an args array printed a DEP0190 deprecation on every run. Both fixed before it shipped.
      2026-09-15: the link check skips git-ignored targets. Its one standing warning pointed
      at .agent-pipe/README.md, the agent-pipe skill's mailbox, which CLAUDE.md describes as
      gitignored but which was not in .gitignore at all - fixed there, and added to the
      must-be-ignored list so `git add -f` on it is an error. An ignored path is not part of
      the repo, so its absence is expected rather than rot, and one permanent known-false
      warning teaches people to skim the whole report.
      2026-09-15: the docs check now also verifies that every check name checks.js emits has a
      row in the README's check table, decided by Kent after the gap was found by hand -
      `targets` shipped emitting findings with no row, so the table documented 11 of 12
      checks. The names are scanned out of the source rather than kept in a list beside it,
      because a list is one more thing to forget to update, which is the defect and not the
      fix; scanning's own failure mode is covered by treating "no names found at all" as a
      finding, since a regex that silently matches nothing would otherwise report a clean
      bill forever. Only the check table is searched, so a same-named row in the targets
      table cannot stand in for a missing one.
      2026-09-15: two fixes found by dogfooding. trackedFiles() used `git ls-files`, which
      does not see a file until it is tracked - so a secret in a file added during a session
      passed every check and would have been caught by the commit AFTER the one that leaked
      it. Now scans untracked-but-not-ignored files too. And a file may opt out of one named
      check with `checks-allow: <check> - <reason>`; the reason is mandatory, because the
      fixtures in test/checks.test.js must stay real to prove the scanner works, while a
      blanket test/** skip would mean a genuine secret in a test file is never caught.
      26 tests, each planting the fault it claims to catch.

  - id: FEAT-0014
    title: Configurable schedule - change-run-time
    description: >
      `make change-run-time 0430` moves the nightly sync. The time is stored as SYNC_AT
      in .env, the watchdog follows six hours later as WATCHDOG_AT, and both scheduled jobs
      are reinstalled so the scheduler picks the change up.
    components: [tooling, ops, qa]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-15
    updated: 2026-09-15
    notes: >
      The watchdog moves with the sync rather than staying at 09:00, because the six-hour gap
      is the watchdog's whole purpose - on the sync's own schedule it is silent in exactly
      the case it exists to catch, and the gap also lets a slow or retrying sync finish
      before its heartbeat is judged. Moving the sync to 09:00 without that rule would have
      collided the two silently.
      The time reaches the plist by substitution into the rendered XML rather than by adding
      __SYNC_HOUR__ placeholders to the templates, because the README documents installing
      them by hand with sed on the two placeholders that exist; a third would leave that
      documented path producing a plist with a literal __SYNC_HOUR__ in it, which launchd
      rejects while complaining about the file rather than the value.
      The time is written as four-digit HHMM (0430), not HH:MM, and that is a consistency
      decision rather than a style one: both shims now take the same arguments in the same
      order, so a command learned on one machine works on the other. HH:MM cannot do that.
      A colon is a rule separator to make, so `make change-run-time 04:30` dies with
      "multiple target patterns" while the Makefile is still being parsed - before make.js
      runs, which is why no useful message can come from the code - and quoting does not
      rescue it, because the shell strips the quotes before make sees the word (verified for
      "04:30", '04:30' and 04\:30). An earlier build worked around this with an `at=04:30`
      form under make only; that was dropped, because a shim-specific spelling is the
      inconsistency this decision exists to remove. Zero-padded HH:MM is still parsed, simply
      not taught; 4:30 and 430 are rejected, so the tolerance is narrower than "HH:MM" implies.
      checkTargetArgs() (FEAT-0013) now fails the build if any target's documented arguments
      contain a colon or a raw --flag, so neither trap can be reintroduced by a new target.
      Stored in .env rather than in state/ because it is deployment configuration, not
      run state, and .env is already the git-ignored home for that. Known limit: the
      scheduler keeps its own copy of the time, so editing SYNC_AT by hand changes nothing
      until the jobs are reinstalled - change-run-time reinstalls them, and says so when
      no job is installed yet.

  - id: FEAT-0015
    title: Cutting a release - make release
    description: >
      `make release` names the `## Unreleased` section in VERSIONS.md after HEAD
      (YYYY.MM.DD-<short sha>), repoints every features.yaml entry that pointed at
      "Unreleased", verifies, commits, tags and publishes a GitHub release whose notes are
      that section's body. `make release dry=1` reports all of it and writes nothing.
    components: [tooling, qa]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-15
    updated: 2026-09-15
    notes: >
      Before this the version format existed only as a sentence in VERSIONS.md's preamble
      and a preview line in `make version`; nothing produced one, there were no git tags in
      the repo's history and no GitHub releases, so seven of fourteen features had
      accumulated under a single "Unreleased" heading.
      The books are rewritten before the verification runs, not after, because
      checkManifest cross-checks features.yaml `release:` values against VERSIONS.md
      headings - verifying the pre-rename state would prove nothing about the state being
      shipped. A failed verification rolls both files back, so an abandoned release leaves
      the tree exactly as it found it rather than half-renamed.
      The tag is pushed before `gh release create` runs: given a tag the remote has never
      seen, gh creates one itself from the remote's default branch, which is not
      necessarily the commit that was tested.
      Authorisation is probed with `gh repo view` up front rather than discovered at the
      final step, because gh resolves credentials per host and not per repo - the active
      account can easily be one without write access here, and that failure would otherwise
      land after the tag had already been pushed.
      Known limit: it always releases HEAD as of today, so the version cannot be chosen or
      backdated, and re-running on the same commit on the same day is refused by the
      existing-tag check rather than producing a second name for one commit.

  - id: FEAT-0016
    title: Release kit install - bootstrap.cmd and from-release
    description: >
      A machine with no git, no make and no development tooling can run the sync from a
      downloaded release asset. `make release` attaches `youtube-playlists-<version>.zip`
      (about 230 KB) to the GitHub release; on the target machine `bootstrap.cmd` checks for
      Node and calls `from-release`, which installs runtime dependencies, creates .env and
      config/channels.txt from their templates and prints the remaining steps and the
      maintenance commands. README gains an "Install from a release kit" section.
    components: [tooling, ops]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-15
    updated: 2026-09-15
    notes: >
      The entry point is a .cmd rather than a make target because the literal request -
      `make from-release` - cannot work on the deployment platform: Windows ships no make,
      and build.ps1 is refused under the default execution policy with "running scripts is
      disabled on this system". bootstrap.cmd has neither problem, runs on a double-click,
      and invokes build.ps1 with -ExecutionPolicy Bypass for that one call. The target
      itself still exists and is what the .cmd calls, so `make from-release` does work once
      Node is present.
      Node.js remains a genuine manual prerequisite - installing it needs an administrator -
      so a missing Node is reported as instructions and a download link rather than as
      "'node' is not recognized". Node is looked for on PATH and then at
      C:\Program Files\nodejs\node.exe, the same fallback run-sync.cmd already uses, because
      a freshly installed Node is often not yet on PATH in an already-open window.
      The kit is `git archive` of the tag rather than a copy of the working directory. That
      is a safety property: it can only contain tracked files, so .env, state/ and logs/
      cannot reach a public asset even by mistake.
      It does not vendor node_modules - 239 MB per release, and dependencies frozen at
      release time - so the first run needs a route to the npm registry. Chosen knowing the
      deployment box has one, since it reaches YouTube and Microsoft Graph nightly; an npm
      install failure says this explicitly rather than reporting a bare exit code.
      Installs with --omit=dev, so eslint is absent and `make ci` does not run on the
      deployment box. That is deliberate - the gate belongs on the machine the code is
      edited on - but it does mean a kit machine cannot self-verify beyond `doctor`.

  - id: FEAT-0017
    title: Verified credentials and a non-empty channel list before scheduling
    description: >
      `doctor` proves the Google credentials work rather than reporting that the variables
      are non-empty, and `install` refuses to register the nightly job until they do and
      until config/channels.txt names at least one channel. The proof is an OAuth refresh
      token exchange, which costs no YouTube Data API quota. Email credentials warn but
      never block. The example channels in config/channels.example.txt are commented out.
    components: [tooling, ops, qa]
    status: complete
    release: 2026.09.15-84b809c
    added: 2026-09-15
    updated: 2026-09-15
    notes: >
      Both .env and config/channels.txt are created by COPYING their templates, so on a
      fresh machine every variable is non-empty and the channel file parses cleanly. The
      old checks asked "is it set" and "do the lines parse", which both answered yes to an
      untouched machine - `doctor` said "Ready" before anyone had configured anything, and
      that is precisely the machine about to be handed a 3 AM scheduled task.
      A placeholder is defined as "identical to the value .env.example ships" rather than
      as anything that looks suspicious. That needs no judgement about what a real client
      id resembles and cannot drift: change the template and the check follows.
      The live proof exchanges the refresh token for an access token against the OAuth
      token endpoint, which spends no Data API quota - the property test/credentials.test.js
      already relied on. It is the strongest check available for free, because it proves the
      client id, secret and refresh token are a working SET rather than three strings.
      install gates rather than warns because a scheduled task runs where nobody is
      watching: a credential failure at 3 AM is silent, no report is written, and the only
      signal is the watchdog 36 hours later. Installing is the last moment a person is
      present to be told. An empty channel list is worse still - the run succeeds, reports
      zero channels and the watchdog stays quiet, because the sync really did finish.
      Email deliberately does not gate: without it the run still does its work and writes
      report.html, so a missing mailbox is a degraded feature, not a dead job.
      A failure to REACH the OAuth endpoint also blocks, and that is intentional rather
      than an oversight: it is the same endpoint the nightly sync depends on, so a machine
      that cannot reach it cannot run the job either.
      Known limit: the check proves the credentials authenticate, not that the account they
      belong to is the one that owns the playlists, and not that the YouTube Data API is
      enabled on the project - both cost quota to establish.
